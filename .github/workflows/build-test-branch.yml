name: Build Test Branch

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: build-test-branch
  cancel-in-progress: false

jobs:
  build-test:
    name: Build build-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure build-test push credentials
        id: push-token
        env:
          BUILD_TEST_PUSH_TOKEN: ${{ secrets.BUILD_TEST_PUSH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$BUILD_TEST_PUSH_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${BUILD_TEST_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            echo "Using BUILD_TEST_PUSH_TOKEN for build-test push."
            echo "uses_build_test_push_token=true" >> "$GITHUB_OUTPUT"
          else
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            echo "Using GITHUB_TOKEN for build-test push."
            echo "uses_build_test_push_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch release comparison refs
        run: |
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            build-test:refs/remotes/origin/build-test

      - name: Check release versions are consistent
        run: scripts/check-version.sh

      - name: Check dev release version is incremented from main
        run: scripts/check-version.sh --incremented-from origin/main

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: |
          npm ci --prefix packages/cadjs
          npm ci --prefix viewer
          npm ci --prefix docs

      - name: Check dev symlink layout
        run: scripts/dev.sh --check

      - name: Create local build-test branch
        run: git checkout -B build-test "$GITHUB_SHA"

      - name: Build production outputs
        run: scripts/build.sh --clean

      - name: Validate production build layout
        run: scripts/check/check-builds.sh

      - name: Run code tests
        run: scripts/test.sh

      - name: Commit build artifacts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No build artifact changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Build artifacts for ${GITHUB_SHA}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push build-test branch
        run: git push --force-with-lease origin HEAD:build-test

      - name: Dispatch build-test checks
        if: steps.push-token.outputs.uses_build_test_push_token != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in test.yml check-builds.yml check-version.yml; do
            curl --fail --show-error --silent \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d '{"ref":"build-test"}'
          done
