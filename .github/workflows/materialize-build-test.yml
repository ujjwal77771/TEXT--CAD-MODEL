name: Materialize Build Test

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-build-test
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize build-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: |
          npm ci --prefix packages/cadjs
          npm ci --prefix viewer
          npm ci --prefix docs

      - name: Check dev symlink layout
        run: scripts/check/check-dev-symlinks.sh

      - name: Create local build-test branch
        run: git checkout -B build-test "$GITHUB_SHA"

      - name: Materialize generated outputs
        run: scripts/build.sh --clean

      - name: Validate materialized layout
        run: scripts/check/check-materialized.sh

      - name: Run full repo test suite
        run: scripts/test.sh

      - name: Commit materialized outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized output changes to commit."
            exit 0
          fi
          git commit -m "Build artifacts for ${GITHUB_SHA}"

      - name: Push build-test branch
        run: git push --force-with-lease origin HEAD:build-test
