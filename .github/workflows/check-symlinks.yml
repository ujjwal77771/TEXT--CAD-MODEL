name: Check Symlinks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  check-symlinks:
    name: Check Symlinks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check development symlinks
        run: scripts/github-workflows/check-symlinks.sh
