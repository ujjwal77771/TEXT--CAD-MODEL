version: 2
updates:
  # Maintain dependencies for pip (Python)
  - package-ecosystem: "pip"
    directory: "/" 
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
      
  # Check for updates in the webapp/backend folder too, just in case
  - package-ecosystem: "pip"
    directory: "/webapp/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
